<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07131b">
  <title>Auto Loop Animated List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Auto Loop Animated List</h1>

    <section class="stage" aria-label="Automatically scrolling feature list">
      <div class="list-window">
        <div class="list-track">
          <div class="list-group">
            <article class="list-item"><span class="emoji">🔥</span><span>Dashboard UI</span></article>
            <article class="list-item"><span class="emoji">🎨</span><span>Animation Effects</span></article>
            <article class="list-item"><span class="emoji">⚡</span><span>Fast Interaction</span></article>
            <article class="list-item"><span class="emoji">💎</span><span>Premium Design</span></article>
            <article class="list-item"><span class="emoji">🚀</span><span>Smooth UX</span></article>
          </div>
          <div class="list-group" aria-hidden="true">
            <article class="list-item"><span class="emoji">🔥</span><span>Dashboard UI</span></article>
            <article class="list-item"><span class="emoji">🎨</span><span>Animation Effects</span></article>
            <article class="list-item"><span class="emoji">⚡</span><span>Fast Interaction</span></article>
            <article class="list-item"><span class="emoji">💎</span><span>Premium Design</span></article>
            <article class="list-item"><span class="emoji">🚀</span><span>Smooth UX</span></article>
          </div>
        </div>
      </div>
    </section>
    <p class="hint">A seamless vertical loop — hover to pause</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
